name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: python -m pytest -q
      - name: Publish readable pytest status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.pytest.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'pytest-${{ matrix.python-version }}',
              description: passed ? 'pytest passed' : 'pytest failed'
            });
      - name: Fail job when pytest failed
        if: always() && steps.pytest.outcome != 'success'
        run: exit 1
