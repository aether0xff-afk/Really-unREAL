name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run pytest
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Publish readable pytest status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const passed = '${{ steps.pytest.outcome }}' === 'success';
            let suffix = '';
            if (!passed && fs.existsSync('pytest.log')) {
              const lines = fs.readFileSync('pytest.log', 'utf8').split(/\r?\n/);
              const failure = lines.find(line => line.startsWith('FAILED ') || line.startsWith('ERROR '));
              if (failure) {
                suffix = '|' + failure.replace(/^FAILED\s+|^ERROR\s+/, '').slice(0, 150);
              }
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: `pytest-${{ matrix.python-version }}${suffix}`,
              description: passed ? 'pytest passed' : 'pytest failed'
            });
      - name: Fail job when pytest failed
        if: always() && steps.pytest.outcome != 'success'
        run: exit 1
