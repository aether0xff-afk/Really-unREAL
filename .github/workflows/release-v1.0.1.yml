name: Release v1.0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.0.1.yml"

permissions:
  contents: write
  statuses: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and build dependencies
        run: python -m pip install -e ".[dev,build]"

      - name: Verify release version
        shell: pwsh
        run: |
          $version = python -c "import backend; print(backend.__version__)"
          if ($version.Trim() -ne "1.0.1") {
            throw "Expected backend.__version__=1.0.1, got $version"
          }

      - name: Run tests
        run: pytest -q

      - name: Import desktop GUI
        run: python -c "import backend.gui; import backend.gui_entry; print('GUI import OK')"

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Really-unREAL backend/gui_entry.py

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          & .\dist\Really-unREAL.exe --smoke
          exit $LASTEXITCODE

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/Really-unREAL.exe package/Really-unREAL.exe
          Copy-Item docs/QUICKSTART_GUI.md package/QUICKSTART.md
          Compress-Archive -Path package/* -DestinationPath Really-unREAL-v1.0.1-Windows-x64.zip -Force

      - name: Create v1.0.1 GitHub Release
        id: release
        continue-on-error: true
        shell: pwsh
        run: |
          if (gh release view v1.0.1 *> $null) {
            gh release upload v1.0.1 Really-unREAL-v1.0.1-Windows-x64.zip --clobber
          } else {
            gh release create v1.0.1 `
              Really-unREAL-v1.0.1-Windows-x64.zip `
              --target "$env:GITHUB_SHA" `
              --title "Really-unREAL v1.0.1" `
              --notes-file RELEASE_NOTES_v1.0.1.md
          }

      - name: Publish release status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.release.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'release-v1.0.1',
              description: ok ? 'v1.0.1 release and Windows asset published' : 'v1.0.1 release publication failed'
            });

      - name: Fail when release publication failed
        if: always() && steps.release.outcome != 'success'
        run: exit 1
