name: Release v1.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.1.0.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and build dependencies
        id: install
        continue-on-error: true
        run: python -m pip install -e ".[dev,build]"

      - name: Verify final version
        id: version
        continue-on-error: true
        shell: pwsh
        run: |
          $version = python -c "import backend; print(backend.__version__)"
          if ($version.Trim() -ne "1.1.0") { throw "Expected 1.1.0, got $version" }

      - name: Run full contract and regression tests
        id: tests
        continue-on-error: true
        run: pytest -q

      - name: Import integrated desktop runtime
        id: import_gui
        continue-on-error: true
        run: python -c "import backend.live_timing; import backend.generation_guard; import backend.persona.style_fingerprint; import backend.providers.errors; import backend.gui_live; import backend.gui_chat_window; import backend.gui_responsive; import backend.gui_entry; print('v1.1.0 import OK')"

      # Hosted NVIDIA availability is an external health signal, not a property of
      # the release artifact. The provider contract itself is covered by pytest.
      # Keep the live health check visible, but do not let a third-party outage
      # prevent a validated local/Windows release from being published.
      - name: Check NVIDIA CI secret health
        id: secret
        continue-on-error: true
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NVIDIA_API_KEY)) { throw "NVIDIA_API_KEY repository secret is missing" }

      - name: Check hosted NVIDIA NIM health with transient retries
        id: nvidia
        if: steps.secret.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $success = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "NVIDIA health attempt $attempt/4"
            python -m backend.nvidia_smoke
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            if ($attempt -lt 4) {
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $success) { throw "Hosted NVIDIA health check failed after 4 attempts" }

      - name: Build Windows executable
        id: build
        continue-on-error: true
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Really-unREAL backend/gui_entry.py

      - name: Smoke test packaged executable
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          & .\dist\Really-unREAL.exe --smoke
          exit $LASTEXITCODE

      - name: Package portable ZIP
        id: package
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/Really-unREAL.exe package/Really-unREAL.exe
          Copy-Item docs/QUICKSTART_GUI.md package/QUICKSTART.md
          Compress-Archive -Path package/* -DestinationPath Really-unREAL-v1.1.0-Windows-x64.zip -Force

      - name: Create or update v1.1.0 GitHub Release
        id: release
        if: steps.install.outcome == 'success' && steps.version.outcome == 'success' && steps.tests.outcome == 'success' && steps.import_gui.outcome == 'success' && steps.build.outcome == 'success' && steps.smoke.outcome == 'success' && steps.package.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          gh release view v1.1.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v1.1.0 release already exists; replacing Windows asset"
            gh release upload v1.1.0 Really-unREAL-v1.1.0-Windows-x64.zip --clobber
          } else {
            Write-Host "Creating v1.1.0 release"
            gh release create v1.1.0 Really-unREAL-v1.1.0-Windows-x64.zip --target "$env:GITHUB_SHA" --title "Really-unREAL v1.1.0" --notes-file RELEASE_NOTES_v1.1.0.md
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release create/upload failed" }

      - name: Publish per-step release statuses
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcomes = {
              install: '${{ steps.install.outcome }}',
              version: '${{ steps.version.outcome }}',
              tests: '${{ steps.tests.outcome }}',
              import: '${{ steps.import_gui.outcome }}',
              secret: '${{ steps.secret.outcome }}',
              nvidia: '${{ steps.nvidia.outcome }}',
              build: '${{ steps.build.outcome }}',
              exe_smoke: '${{ steps.smoke.outcome }}',
              package: '${{ steps.package.outcome }}',
              release: '${{ steps.release.outcome }}'
            };
            for (const [name, outcome] of Object.entries(outcomes)) {
              const informational = name === 'secret' || name === 'nvidia';
              const state = outcome === 'success' ? 'success' : (informational ? 'error' : 'failure');
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state,
                context: `v1.1.0/${name}`,
                description: informational
                  ? `${name} external health: ${outcome}`.slice(0, 140)
                  : `${name}: ${outcome}`.slice(0, 140)
              });
            }
            const required = [
              outcomes.install, outcomes.version, outcomes.tests, outcomes.import,
              outcomes.build, outcomes.exe_smoke, outcomes.package, outcomes.release
            ];
            const ok = required.every(v => v === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'release-v1.1.0',
              description: ok ? 'Really-unREAL v1.1.0 Windows release published' : 'v1.1.0 artifact validation failed'
            });

      - name: Fail when required artifact validation failed
        if: always() && (steps.install.outcome != 'success' || steps.version.outcome != 'success' || steps.tests.outcome != 'success' || steps.import_gui.outcome != 'success' || steps.build.outcome != 'success' || steps.smoke.outcome != 'success' || steps.package.outcome != 'success' || steps.release.outcome != 'success')
        run: exit 1
