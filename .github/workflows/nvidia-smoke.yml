name: NVIDIA NIM smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nvidia-smoke.yml"
      - "backend/nvidia_conversation_smoke.py"
      - "backend/providers/nvidia.py"
      - "backend/generation.py"
      - "backend/generation_context.py"
      - "backend/topic_memory.py"
      - "backend/event_memory.py"
      - "backend/replay_generation.py"
      - "backend/simulation/**"

permissions:
  contents: read
  statuses: write

jobs:
  hosted-nim-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run v1 core tests
        id: core_tests
        continue-on-error: true
        run: python -m pytest -q
      - name: Verify secret is configured
        id: secret
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY repository secret is missing."
            exit 1
          fi
      - name: Call hosted NVIDIA NIM with synthetic context
        id: smoke
        if: steps.secret.outcome == 'success'
        continue-on-error: true
        run: python -m backend.nvidia_smoke
      - name: Run four-turn project conversation
        id: conversation
        if: steps.secret.outcome == 'success' && steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          RESULT_PATH: nvidia-conversation-smoke.json
        run: python -m backend.nvidia_conversation_smoke
      - name: Upload synthetic conversation result
        if: steps.conversation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-conversation-smoke
          path: nvidia-conversation-smoke.json
          retention-days: 1
      - name: Publish readable commit statuses
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testsSuccess = '${{ steps.core_tests.outcome }}' === 'success';
            const smokeSuccess = '${{ steps.secret.outcome }}' === 'success' && '${{ steps.smoke.outcome }}' === 'success';
            const conversationSuccess = '${{ steps.conversation.outcome }}' === 'success';
            const releaseSuccess = testsSuccess && smokeSuccess && conversationSuccess;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: smokeSuccess ? 'success' : 'failure',
              context: 'nvidia-nim-smoke',
              description: smokeSuccess ? 'Hosted NVIDIA NIM smoke passed' : 'Hosted NVIDIA NIM smoke failed'
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: conversationSuccess ? 'success' : 'failure',
              context: 'nvidia-conversation-smoke',
              description: conversationSuccess ? 'Four-turn project conversation passed' : 'Four-turn project conversation failed'
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: releaseSuccess ? 'success' : 'failure',
              context: 'v1-release-smoke',
              description: releaseSuccess ? 'v1 core tests + hosted generation passed' : 'v1 release smoke failed'
            });
            if (conversationSuccess && fs.existsSync('nvidia-conversation-smoke.json')) {
              const data = JSON.parse(fs.readFileSync('nvidia-conversation-smoke.json', 'utf8'));
              for (const turn of data.turns) {
                const text = (turn.target || []).join(' / ').replace(/\s+/g, ' ').slice(0, 78) || '(empty)';
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: context.sha,
                  state: 'success',
                  context: `turn-${turn.turn}|${text}`,
                  description: `Synthetic NVIDIA conversation turn ${turn.turn}`
                });
              }
            }
      - name: Fail job when release smoke failed
        if: always() && (steps.core_tests.outcome != 'success' || steps.secret.outcome != 'success' || steps.smoke.outcome != 'success' || steps.conversation.outcome != 'success')
        run: exit 1
