name: NVIDIA NIM smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nvidia-smoke.yml"

permissions:
  contents: read
  statuses: write

jobs:
  hosted-nim-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Verify secret is configured
        id: secret
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY repository secret is missing."
            exit 1
          fi
      - name: Call hosted NVIDIA NIM with synthetic context
        id: smoke
        if: steps.secret.outcome == 'success'
        continue-on-error: true
        run: python -m backend.nvidia_smoke
      - name: Publish readable commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ steps.secret.outcome }}' === 'success' && '${{ steps.smoke.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'nvidia-nim-smoke',
              description: success ? 'Hosted NVIDIA NIM smoke passed' : 'Hosted NVIDIA NIM smoke failed'
            });
      - name: Fail job when smoke failed
        if: always() && (steps.secret.outcome != 'success' || steps.smoke.outcome != 'success')
        run: exit 1
