name: Release v1.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.0.0.yml"

permissions:
  contents: write
  statuses: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run test suite
        id: tests
        continue-on-error: true
        run: pytest -q
      - name: Verify NVIDIA hosted NIM integration
        id: nim
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: python -m backend.nvidia_smoke
      - name: Create GitHub Release
        id: release
        if: steps.tests.outcome == 'success' && steps.nim.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; leaving the existing release unchanged."
            exit 0
          fi
          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title "Really-unREAL v1.0.0" \
            --notes-file RELEASE_NOTES_v1.0.0.md
      - name: Publish release status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.tests.outcome }}' === 'success' &&
                       '${{ steps.nim.outcome }}' === 'success' &&
                       '${{ steps.release.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'release-v1.0.0',
              description: ok ? 'Tests, NVIDIA smoke, and v1.0.0 release passed' : 'v1.0.0 release validation failed'
            });
      - name: Fail when release validation failed
        if: always() && (steps.tests.outcome != 'success' || steps.nim.outcome != 'success' || steps.release.outcome != 'success')
        run: exit 1
