name: Release v1.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.0.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run test suite
        run: pytest -q
      - name: Verify NVIDIA hosted NIM integration
        run: python -m backend.nvidia_smoke
      - name: Create GitHub Release
        shell: bash
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; leaving the existing release unchanged."
            exit 0
          fi
          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title "Really-unREAL v1.0.0" \
            --notes-file RELEASE_NOTES_v1.0.0.md
