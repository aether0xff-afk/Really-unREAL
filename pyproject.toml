[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "really-unreal"
version = "1.0.4"
description = "Local-first conversation-behavior digital-twin simulation framework"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
really-unreal = "backend.gui_entry:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
